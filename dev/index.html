<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pinspec test page</title>
    <!-- A small Tailwind v4 + shadcn style system so token snapping has something to find. -->
    <style>
      :root {
        --spacing: 0.25rem;
        --radius-sm: 0.25rem;
        --radius-md: 0.375rem;
        --radius-lg: 0.5rem;
        --radius-xl: 0.75rem;
        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --color-gray-100: #f3f4f6;
        --color-gray-500: #6b7280;
        --color-gray-900: #111827;
        --color-blue-600: #2563eb;
        --background: #ffffff;
        --foreground: #0a0a0a;
        --muted-foreground: #6b7280;
        --primary: #171717;
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-muted-foreground: var(--muted-foreground);
        --color-primary: var(--primary);
      }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--background); color: var(--foreground); }
      .page { max-width: 720px; margin: 64px auto; padding: 0 24px; }
      .card { border: 1px solid #e5e7eb; border-radius: var(--radius-lg); padding: 24px; }
      .title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
      .muted { color: var(--muted-foreground); font-size: var(--text-sm); margin: 0 0 16px; }
      .row { display: flex; gap: 8px; }
      .btn { width: 232px; height: 32px; border-radius: 4px; border: 0; background: var(--primary); color: #fff; font-size: 14px; font-weight: 500; }
      .btn-ghost { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid #e5e7eb; background: transparent; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1 class="title">Workspace settings</h1>
        <p class="muted">Changes apply to everyone in the workspace.</p>
        <div class="row">
          <button class="btn inline-flex items-center rounded-sm" onclick="alert('page click leaked')">Save changes</button>
          <button class="btn-ghost">Cancel</button>
        </div>
      </div>
    </div>
  </body>
</html>
