# Creates a GitHub release with pinspec-<version>.zip attached, for the
# version in package.json. Run it from the Actions tab (Release → Run
# workflow), or push a tag like v0.2.0. The zip is what you upload to the
# Chrome Web Store by hand for the very first version; after that the
# Build extension workflow publishes automatically (store/AUTO-PUBLISH.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check package.json and manifest.json agree (and match the tag)
        run: |
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./public/manifest.json').version")
          if [ "$pkg" != "$manifest" ]; then
            echo "package.json $pkg and manifest.json $manifest must match" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $pkg" >&2
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: pinspec ${{ env.VERSION }}
          files: pinspec-${{ env.VERSION }}.zip
          generate_release_notes: true
